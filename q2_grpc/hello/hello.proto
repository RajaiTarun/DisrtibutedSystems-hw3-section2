// tiny test to check that grpc + protobuf work on this machine (phase 0 of the plan)
// the client sends a name, the server answers "Hello <name>"

syntax = "proto3";

package hello;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
